<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <!-- Blue petal gradient -->
    <linearGradient id="careqBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#1E6FD9" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Green petal gradient -->
    <linearGradient id="careqGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="60%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Subtle drop shadow for cross -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Group containing Logo Mark (Q with Cross) -->
  <g transform="translate(160, 68)">
    <!-- Top-Left Blue Leaf/Petal -->
    <path
      d="M -3, -48 
         C -28, -48, -48, -28, -48, -3 
         C -48, 16, -34, 30, -18, 36 
         C -18, 15, -4, 0, 16, -16 
         C 16, -34, 6, -48, -3, -48 Z"
      fill="url(#careqBlue)"
    />

    <!-- Bottom-Right Green Leaf/Petal forming Q tail -->
    <path
      d="M 3, 48 
         C 28, 48, 48, 28, 48, 3 
         C 48, -16, 34, -30, 18, -36 
         C 18, -15, 4, 0, -16, 16 
         C -16, 34, -6, 48, 3, 48 Z"
      fill="url(#careqGreen)"
    />

    <!-- Q Tail extension -->
    <path
      d="M 18, 22 
         C 28, 30, 36, 42, 42, 48 
         C 45, 51, 38, 52, 30, 48 
         C 22, 44, 16, 36, 14, 28 Z"
      fill="url(#careqGreen)"
    />

    <!-- Inner Central White Medical Cross -->
    <g filter="url(#softShadow)">
      <!-- Horizontal Cross Bar -->
      <rect x="-22" y="-7" width="44" height="14" rx="4" fill="#FFFFFF" />
      <!-- Vertical Cross Bar -->
      <rect x="-7" y="-22" width="14" height="44" rx="4" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography: CAREQ -->
  <!-- "CARE" in Deep Medical Navy/Teal, "Q" in Vibrant Green or matching Navy -->
  <text
    x="160"
    y="168"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    font-size="34"
    font-weight="800"
    letter-spacing="1.5"
    fill="#0F3B7D"
  >
    CARE<tspan fill="#16A34A">Q</tspan>
  </text>

  <!-- Tagline: Smart Hospital Management, Better Care, Together. -->
  <text
    x="160"
    y="192"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    font-size="10.5"
    font-weight="500"
    letter-spacing="0.2"
    fill="#64748B"
  >
    Smart Hospital Management, Better Care, Together.
  </text>
</svg>
